name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.3"
  VITE_APP_ORIGIN: "https://strata-studio.example"
  VITE_TERRAIN_TILE_URL: "https://strata-proxy.example/terrain"
  VITE_OVERPASS_URL: "https://strata-proxy.example/overpass"
  VITE_BUILD_CONTEXT: "ci"

jobs:
  verify:
    name: Lint, types, unit, build, and Worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'web/bun.lock', 'workers/proxy/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install all package boundaries from lockfiles
        run: bun run install:frozen

      - name: Check pinned Bun version
        run: test "$(bun --version)" = "$BUN_VERSION"

      - name: Lint web app
        run: bun run lint

      - name: Test the Bun type-check guard
        run: bun run test:bun-check

      - name: Typecheck web app and proxy
        run: bun run typecheck

      - name: Run both unit suites
        run: bun run test:unit

      - name: Build production fixture and assert proxy-first bundle
        run: bun run build

      - name: Dry-run the proxy Worker bundle
        run: bun run check:wrangler

      - name: Upload production app
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  chromium-smoke:
    name: Chromium launch smoke
    needs: verify
    runs-on: ubuntu-latest
    container:
      # Official browser/dependency image, matched to the frozen Playwright package.
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Bun in the browser image
        # The official Playwright image intentionally omits unzip.
        run: npm install --global bun@${BUN_VERSION} && test "$(bun --version)" = "$BUN_VERSION"

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install launch-test and Vite preview dependencies
        run: bun install --frozen-lockfile && bun install --cwd web --frozen-lockfile

      - name: Restore production app
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Run launch smoke tests
        run: bun run test:launch:built
        env:
          HOME: /root

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  broad-launch:
    name: Browser and accessibility coverage
    # Map decoding and compositing must pass all engines before merging.
    needs: verify
    runs-on: ubuntu-latest
    container:
      # Official browser/dependency image, matched to the frozen Playwright package.
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Bun in the browser image
        # The official Playwright image intentionally omits unzip.
        run: npm install --global bun@${BUN_VERSION} && test "$(bun --version)" = "$BUN_VERSION"

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install launch-test and Vite preview dependencies
        run: bun install --frozen-lockfile && bun install --cwd web --frozen-lockfile

      - name: Restore production app
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Run Firefox and WebKit launch smoke
        run: bun run test:launch:browsers
        env:
          HOME: /root

      - name: Run Chromium accessibility gate
        run: bun run test:launch:a11y
        env:
          HOME: /root

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-broad-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
